services:
  engine:
    build: 
      context: ./engine
    ports:
      - '8000:8000'
    environment:
      - BLOCKCHAIN_URL=http://blockchain:8080
    depends_on:
      - blockchain
    networks:
      - symbio-net

  frontend:
    build:
      context: ./frontend
    ports:
      - '3001:3000' # CHANGED: Now uses 3001 to avoid collision
    environment:
      - NEXT_PUBLIC_API_URL=http://engine:8000 # CHANGED: Uses service name
    depends_on:
      - engine
    networks:
      - symbio-net

  blockchain:
    image: ibmcom/ibp-microfab
    container_name: symbio-link-blockchain
    ports:
      - '3000:3000' # Keeps 3000
    networks:
      - symbio-net

networks:
  symbio-net:
    driver: bridge